<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">LMS-Watcher</title>
  <desc id="desc">Pixel style LMS-Watcher logo for the SLTC LMS Telegram notifier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#061826"/>
      <stop offset="0.55" stop-color="#0f2144"/>
      <stop offset="1" stop-color="#122e4a"/>
    </linearGradient>
    <linearGradient id="text" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.45" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="300" rx="28" fill="url(#bg)"/>
  <path d="M40 58h880v184H40z" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="12 10" opacity="0.45"/>
  <g opacity="0.16" fill="#e0f2fe">
    <rect x="72" y="42" width="8" height="8"/><rect x="112" y="260" width="8" height="8"/>
    <rect x="820" y="48" width="8" height="8"/><rect x="868" y="248" width="8" height="8"/>
    <rect x="500" y="36" width="6" height="6"/><rect x="448" y="260" width="6" height="6"/>
  </g>
  <text x="480" y="134" text-anchor="middle" fill="url(#text)" filter="url(#glow)"
        font-family="Consolas, 'Courier New', monospace" font-size="64" font-weight="800" letter-spacing="2">
    LMS-Watcher
  </text>
  <text x="480" y="180" text-anchor="middle" fill="#dbeafe"
        font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">
    SLTC LMS alerts for assignments, quizzes, resources, and deadlines
  </text>
  <text x="480" y="218" text-anchor="middle" fill="#7dd3fc"
        font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">
    Telegram notifications • guided setup • quiet when nothing changes
  </text>
</svg>