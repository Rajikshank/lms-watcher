<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LMS-Watcher</title>
  <desc id="desc">Modern retro pixel-style LMS-Watcher logo for the SLTC LMS Telegram notifier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.48" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.45" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.25 0 0 0 0 0.85 0 0 0 0 1 0 0 0 0.75 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="1" height="8" patternUnits="userSpaceOnUse">
      <rect width="1" height="4" fill="#ffffff" opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="34" fill="url(#scan)"/>
  <rect x="34" y="34" width="1132" height="352" rx="22" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
  <rect x="54" y="54" width="1092" height="312" rx="14" fill="#020617" opacity="0.34"/>

  <g opacity="0.32" fill="#67e8f9">
    <rect x="78" y="72" width="10" height="10"/><rect x="98" y="72" width="10" height="10"/>
    <rect x="1092" y="72" width="10" height="10"/><rect x="1112" y="72" width="10" height="10"/>
    <rect x="78" y="338" width="10" height="10"/><rect x="98" y="338" width="10" height="10"/>
    <rect x="1092" y="338" width="10" height="10"/><rect x="1112" y="338" width="10" height="10"/>
  </g>

  <g filter="url(#softGlow)">
    <text x="600" y="132" text-anchor="middle" fill="url(#word)"
          font-family="Consolas, 'SFMono-Regular', 'Cascadia Mono', 'Courier New', monospace"
          font-size="34" font-weight="900" letter-spacing="0" xml:space="preserve">██      ███    ███  ██████        ██     ██  █████  ████████  ██████ ██   ██ ███████ ██████</text>
    <text x="600" y="174" text-anchor="middle" fill="url(#word)"
          font-family="Consolas, 'SFMono-Regular', 'Cascadia Mono', 'Courier New', monospace"
          font-size="34" font-weight="900" letter-spacing="0" xml:space="preserve">██      ████  ████ ██             ██     ██ ██   ██    ██    ██      ██   ██ ██      ██   ██</text>
    <text x="600" y="216" text-anchor="middle" fill="url(#word)"
          font-family="Consolas, 'SFMono-Regular', 'Cascadia Mono', 'Courier New', monospace"
          font-size="34" font-weight="900" letter-spacing="0" xml:space="preserve">██      ██ ████ ██  █████  █████  ██  █  ██ ███████    ██    ██      ███████ █████   ██████</text>
    <text x="600" y="258" text-anchor="middle" fill="url(#word)"
          font-family="Consolas, 'SFMono-Regular', 'Cascadia Mono', 'Courier New', monospace"
          font-size="34" font-weight="900" letter-spacing="0" xml:space="preserve">██      ██  ██  ██      ██        ██ ███ ██ ██   ██    ██    ██      ██   ██ ██      ██   ██</text>
    <text x="600" y="300" text-anchor="middle" fill="url(#word)"
          font-family="Consolas, 'SFMono-Regular', 'Cascadia Mono', 'Courier New', monospace"
          font-size="34" font-weight="900" letter-spacing="0" xml:space="preserve">███████ ██      ██ ██████          ███ ███  ██   ██    ██     ██████ ██   ██ ███████ ██   ██</text>
  </g>

  <text x="600" y="346" text-anchor="middle" fill="#dbeafe"
        font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">
    SLTC LMS Telegram alerts for assignments, quizzes, resources, and deadlines
  </text>
</svg>